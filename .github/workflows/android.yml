name: Android
on:
  push:
    branches: [main, dated-planner]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        working-directory: .
        run: |
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter create --platforms=android --org io.github.gamossup --no-pub .
      - run: python3 tool/configure_android.py
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: shubchik-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
